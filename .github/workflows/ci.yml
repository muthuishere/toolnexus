name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Each language's suite is hermetic (no network, no LLM): local HTTP servers for
# the HTTP/client tests, the shared examples/ fixtures for skills.
jobs:
  conformance:
    name: Cross-port option parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # Fails if a ClientOptions/ToolkitOptions field ships in some ports but not all six
      # (the drift class that hid the JS disableTools/disableSkills gap). No deps.
      - run: python3 conformance/check_options_parity.py

  js:
    name: JS (node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm test

  python:
    name: Python (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - run: python -m pytest -q

  go:
    name: Go (go test -race)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: golang
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...

  java:
    name: Java (gradle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: ./gradlew test --no-daemon

  csharp:
    name: C# (dotnet)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: csharp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build
      - run: dotnet test

  elixir:
    name: Elixir (mix)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elixir
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17"
          otp-version: "27"
      - uses: actions/cache@v4
        with:
          path: |
            elixir/deps
            elixir/_build
          key: mix-${{ runner.os }}-${{ hashFiles('elixir/mix.lock') }}
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix coveralls   # runs the suite + enforces minimum_coverage 95 (coveralls.json)

  clojure:
    name: Clojure (JVM + cljgo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clojure
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      # The MCP stdio tests launch a REAL server
      # (@modelcontextprotocol/server-everything). An MCP stdio server needs its
      # own runtime the same way a Postgres test needs Postgres; without it those
      # tests FAIL rather than skip, by design.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # cljgo is the second host. `go install …@vX.Y.Z` only produces a usable
      # binary as of cljgo v0.8.5 (their #177 / ADR 0116) — earlier releases
      # demanded a source checkout and CLJGO_SRC.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: go install github.com/muthuishere/cljgo/cmd/cljgo@v0.8.9
      - run: echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: clj-${{ runner.os }}-${{ hashFiles('clojure/deps.edn', 'clojure/build.cljgo') }}
      # ALL FIVE execution modes, not two: jvm-main, jvm-repl, cljgo-aot,
      # cljgo-run, cljgo-repl. A port proven only through its compiled path is
      # proven in the mode developers use least, and cljgo's own ADR 0007 calls a
      # REPL-vs-binary divergence unforgivable.
      - run: ./all-modes-check.sh
        env:
          TN_EXAMPLES: ${{ github.workspace }}/examples
      # koine must be the ONLY third-party dependency. S03 measured that 11 of 11
      # popular Clojure libraries carry Java interop and none load on cljgo, so a
      # stray dependency does not degrade the port — it ends the cljgo half.
      - run: ./deps-purity-check.sh
      # Someone with only a JDK must be able to use this like any other Clojure
      # library. Poisons `cljgo` on PATH so a silent dependency becomes a loud
      # failure.
      - run: ./jvm-only-check.sh
        env:
          TN_EXAMPLES: ${{ github.workspace }}/examples
      # The library must not hold a consumer's process open. This caught a 61s
      # hang that 707 green assertions did not.
      - run: ./consumer-exit-check.sh
        env:
          TN_EXAMPLES: ${{ github.workspace }}/examples

  docs-examples:
    name: Docs examples (six full-tier ports)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Every toolchain, because each documented example is compiled AND executed
      # against its own port. Hermetic: no network, no live LLM.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17"
          otp-version: "27"

      # Build the ports the runners link against.
      - run: npm install && npm run build
        working-directory: js
      - run: ./gradlew jar --no-daemon
        working-directory: java

      - name: Extract and run every documented example
        run: bash site/tests/run-all.sh
