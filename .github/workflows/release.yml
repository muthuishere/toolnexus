name: Release

# Publishes the language ports. OIDC-first: npm + PyPI mint short-lived tokens at
# run time (no stored secrets); Go is a tag push. Each port is gated by a repo
# VARIABLE (Settings -> Secrets and variables -> Actions -> Variables) so a port
# stays off until you flip it on — partial onboarding still produces a green run.
#
#   ENABLE_NPM  ENABLE_PYPI  ENABLE_GO  ENABLE_NUGET  ENABLE_JAVA  ENABLE_ELIXIR
#   ENABLE_CLOJARS                                                  (=true to publish)
#
# npm / PyPI / NuGet use OIDC Trusted Publishing (no stored secrets); Go is a tag
# push; Java (Maven Central) uses the prod-environment secrets CENTRAL_USERNAME /
# CENTRAL_PASSWORD / GPG_PRIVATE_KEY / GPG_PASSPHRASE (no OIDC available there);
# Hex uses HEX_API_KEY and Clojars uses CLOJARS_USERNAME / CLOJARS_PASSWORD —
# neither registry offers OIDC.

on:
  release:
    types: [published]        # cut a GitHub Release named vX.Y.Z
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 0.1.0 (manual / dry-run)"
        required: true

permissions:
  contents: write             # go tag push
  id-token: write             # npm + PyPI OIDC

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Resolve + verify version parity
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing version: $VERSION"
          JS=$(node -p "require('./js/package.json').version")
          PY=$(grep -E '^version' python/pyproject.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          CS=$(grep -oE '<Version>[^<]+</Version>' csharp/src/Toolnexus/Toolnexus.csproj | head -1 | sed -E 's/<\/?Version>//g')
          JAVA=$(grep -E "^version" java/build.gradle | head -1 | sed -E "s/.*'([^']+)'.*/\1/")
          EX=$(grep -E '@version "' elixir/mix.exs | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          CLJ=$(grep -E '^\(def version ' clojure/build.clj | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "js=$JS python=$PY csharp=$CS java=$JAVA elixir=$EX clojure=$CLJ"
          fail=0
          [ "$JS" = "$VERSION" ] || { echo "::error::js/package.json is $JS, expected $VERSION"; fail=1; }
          [ "$PY" = "$VERSION" ] || { echo "::error::python/pyproject.toml is $PY, expected $VERSION"; fail=1; }
          [ "$CS" = "$VERSION" ] || { echo "::error::csharp Toolnexus.csproj is $CS, expected $VERSION"; fail=1; }
          [ "$JAVA" = "$VERSION" ] || { echo "::error::java/build.gradle is $JAVA, expected $VERSION"; fail=1; }
          [ "$EX" = "$VERSION" ] || { echo "::error::elixir/mix.exs is $EX, expected $VERSION"; fail=1; }
          [ "$CLJ" = "$VERSION" ] || { echo "::error::clojure/build.clj is $CLJ, expected $VERSION"; fail=1; }
          exit $fail

  live-scenarios:
    # Live harness proof against a REAL model, golang only. The other six ports
    # prove parity hermetically; this proves the mechanisms actually work against
    # a provider before we publish. Gates every registry leg below.
    needs: preflight
    runs-on: ubuntu-latest
    environment: prod          # OPENROUTER_API_KEY lives in this environment's secrets
    permissions: { contents: read }
    defaults: { run: { working-directory: golang } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.23" }
      # The live tests SKIP when the key is absent, which is right for a laptop and
      # wrong for this gate: a skipped proof would report green and prove nothing,
      # so the gate would be theatre. Fail loudly instead, before any leg publishes.
      - name: Require the key (a skipped live proof is not a proof)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::OPENROUTER_API_KEY is not set in the 'prod' environment. The live"
            echo "::error::scenarios would SKIP and this job would go green having verified"
            echo "::error::nothing. Add the secret to the prod environment, then re-run."
            exit 1
          fi
      - name: Live harness scenarios (guardrail, completion gate, bounded stop, delegation)
        # -count=1 so a cached PASS can never stand in for a real provider call.
        run: go test -tags live -run TestLive -v -count=1 ./...
        env:
          # Use-only: read by the test at the point of use, never logged.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

  npm:
    needs: [preflight, live-scenarios]
    if: ${{ vars.ENABLE_NPM == 'true' }}
    runs-on: ubuntu-latest
    environment: prod          # the npm Trusted Publisher is scoped to this environment
    permissions: { id-token: write, contents: read }
    defaults: { run: { working-directory: js } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"               # bundles npm >= 11.5.1 (OIDC trusted publishing);
          registry-url: "https://registry.npmjs.org"
      # No global `npm install -g npm@latest`: self-upgrading the bundled npm corrupts it
      # (drops bundled deps like `sigstore`, breaking `--provenance`). Node 24 already ships
      # a new-enough npm, so use it directly.
      - run: npm ci
      - run: npm run build
      - run: npm publish --provenance --access public
        # No NODE_AUTH_TOKEN: npm uses the OIDC token via the configured Trusted Publisher.

  pypi:
    needs: [preflight, live-scenarios]
    if: ${{ vars.ENABLE_PYPI == 'true' }}
    runs-on: ubuntu-latest
    environment: prod
    permissions: { id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install build
      - run: python -m build
        working-directory: python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
        # OIDC trusted publishing — no API token.

  go-tag:
    needs: [preflight, live-scenarios]
    if: ${{ vars.ENABLE_GO == 'true' }}
    runs-on: ubuntu-latest
    environment: prod
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - name: Push Go module tag
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          TAG="golang/v${VERSION}"
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q "${TAG}"; then
            echo "Tag ${TAG} already exists — skipping."
          else
            git tag "${TAG}"
            git push origin "${TAG}"
          fi

  nuget:
    needs: [preflight, live-scenarios]
    if: ${{ vars.ENABLE_NUGET == 'true' }}
    runs-on: ubuntu-latest
    environment: prod          # the NuGet Trusted Publishing policy is scoped to this environment
    permissions: { id-token: write, contents: read }
    defaults: { run: { working-directory: csharp } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet pack src/Toolnexus/Toolnexus.csproj -c Release -o nupkgs
      - name: NuGet OIDC login (mint a short-lived API key)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: muthuishere
      - name: Push to NuGet
        run: >
          dotnet nuget push nupkgs/*.nupkg
          --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
        # No stored key: the API key is minted via the Trusted Publishing policy + OIDC.

  maven:
    needs: [preflight, live-scenarios]
    if: ${{ vars.ENABLE_JAVA == 'true' }}
    runs-on: ubuntu-latest
    environment: prod          # Central Portal token + GPG key live in this environment's secrets
    permissions: { contents: read }
    defaults: { run: { working-directory: java } }
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: ./gradlew publishAndReleaseToMavenCentral --no-daemon --no-configuration-cache

  hex:
    needs: [preflight, live-scenarios]
    if: ${{ vars.ENABLE_ELIXIR == 'true' }}
    runs-on: ubuntu-latest
    environment: prod          # HEX_API_KEY lives in this environment's secrets (Hex has no OIDC)
    permissions: { contents: read }
    defaults: { run: { working-directory: elixir } }
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17"
          otp-version: "27"
      - run: mix deps.get
      - run: mix hex.publish --yes
        env:
          # Use-only: consumed by mix hex.publish, never echoed or logged.
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}

  clojars:
    needs: [preflight, live-scenarios]
    if: ${{ vars.ENABLE_CLOJARS == 'true' }}
    runs-on: ubuntu-latest
    environment: prod          # CLOJARS_* live in this environment's secrets (Clojars has no OIDC)
    permissions: { contents: read }
    defaults: { run: { working-directory: clojure } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest
      # Release tooling lives behind the :build alias so it never reaches the
      # library's default classpath — deps-purity-check.sh fails the build if it
      # does, and that gate is what keeps the port loadable on cljgo.
      - run: clojure -T:build jar
      - run: clojure -T:build deploy
        env:
          # Use-only: consumed by deps-deploy, never echoed or logged.
          # CLOJARS_PASSWORD must be a Clojars DEPLOY TOKEN, not the password.
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_PASSWORD }}
