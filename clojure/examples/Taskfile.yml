# The interactive chat example, both hosts. Requires OPENROUTER_API_KEY in the
# environment — the value is only ever passed through by name, never echoed.
#
#   task clj-ex1       # the chat agent on the JVM — then just keep asking
#   task cljgo-ex1     # the same source run directly on cljgo (no build step)
#   task clj-ex1 MODEL=...   # any tool-capable OpenRouter model
version: '3'

vars:
  # Small, cheap default. Override per-run: task clj-ex1 MODEL=qwen/qwen-2.5-72b-instruct
  MODEL: openai/gpt-4o-mini
  # The published cljgo, not the local-checkout shim.
  CLJGO: '{{.HOME}}/go/bin/cljgo'

env:
  TN_MODEL: '{{.MODEL}}'

tasks:
  default:
    silent: true
    cmds:
      - task --list

  check-key:
    internal: true
    silent: true
    preconditions:
      - sh: test -n "$OPENROUTER_API_KEY"
        msg: 'OPENROUTER_API_KEY is not set. Export it first (the value is never printed).'

  clj-ex1:
    desc: 'chat agent on the JVM — http tool + filesystem MCP + skill; ask questions in a loop'
    deps: [check-key]
    dir: clj-ex1
    interactive: true
    cmds:
      - clojure -M -m chat

  cljgo-ex1:
    desc: 'the same chat agent run directly on cljgo — no build step'
    deps: [check-key]
    dir: cljgo-ex1
    interactive: true
    preconditions:
      - sh: test -x {{.CLJGO}}
        msg: 'cljgo not found at {{.CLJGO}} — install it: go install github.com/muthuishere/cljgo@latest'
    cmds:
      - '{{.CLJGO}} run src/run_chat.cljc'
