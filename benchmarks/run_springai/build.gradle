plugins {
    id 'application'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

repositories { mavenCentral() }

ext {
    springAiVersion = '2.0.2'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'
    implementation 'org.springframework.ai:spring-ai-starter-mcp-client'
    // SkillsTool (Agent Skills, SKILL.md) for the BENCH_CONFIG=skills row — see
    // https://spring.io/blog/2026/01/13/spring-ai-generic-agent-skills/
    implementation 'org.springaicommunity:spring-ai-agent-utils:0.13.0'
}

application {
    mainClass = 'bench.SpringAiBench'
}
