[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp2026-spike"
version = "0.0.1"
description = "In-house MCP 2026-07-28 client + server spike (no MCP SDK)."
requires-python = ">=3.11"
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["mcp2026"]

[tool.pytest.ini_options]
testpaths = ["tests"]
